<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <h1>TIC TAC TOE</h1>
      <p>The Odin Project</p>
      <div class="controls-sound">
        <button
          id="btn-toggle-sound"
          class="btn-sound"
          aria-label="toggle sound"
        >
          <i class="fas fa-volume-down icon-sound" aria-hidden="true"></i>
        </button>

        <button
          id="btn-toggle-music"
          class="btn-music"
          aria-label="toggle music"
        >
          <i class="fas fa-pause icon-bg-music" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    <main class="container">
      <section class="box-player1">
        <h2 class="box-player-1-header">PLAYER 1 X</h2>
        <div class="box-player1-mid-section">
          <div class="player1-label-name">Name</div>
          <input
            id="player1-input"
            class="player1-input"
            maxlength="12"
            type="text"
          />
          <button id="player1-button" class="player1-button">OK</button>
        </div>

        <div class="box-player1-bottom-section">
          <div class="player1-wins">
            <div id="player1-wins-label" class="player1-wins-label">WINS</div>
            <div id="player1-wins-value" class="player1-wins-value"></div>
          </div>
          <div class="player1-draws">
            <div id="player1-draws-label" class="player1-draws-label">
              DRAWS
            </div>
            <div id="player1-draws-value" class="player1-draws-value"></div>
          </div>
          <div class="player1-lost">
            <div id="player1-lost-label" class="player1-lost-label">LOST</div>
            <div id="player1-lost-value" class="player1-lost-value"></div>
          </div>
        </div>
      </section>

      <div class="board">
        <button class="btn" data-id="0 0"></button>
        <button class="btn" data-id="0 1"></button>
        <button class="btn" data-id="0 2"></button>
        <button class="btn" data-id="1 0"></button>
        <button class="btn" data-id="1 1"></button>
        <button class="btn" data-id="1 2"></button>
        <button class="btn" data-id="2 0"></button>
        <button class="btn" data-id="2 1"></button>
        <button class="btn" data-id="2 2"></button>
      </div>

      <section class="box-player2">
        <h2 class="box-player-2-header">PLAYER 2 O</h2>

        <div class="box-player2-mid-section">
          <div class="player2-label-name">Name</div>
          <input
            id="player2-input"
            class="player2-input"
            maxlength="12"
            type="text"
          />
          <button id="player2-button" class="player2-button">OK</button>
        </div>

        <div class="box-player2-bottom-section">
          <div class="player2-wins">
            <div id="player2-wins-label" class="player2-wins-label">WINS</div>
            <div id="player2-wins-value" class="player2-wins-value"></div>
          </div>
          <div class="player2-draws">
            <div id="player2-draws-label" class="player2-draws-label">
              DRAWS
            </div>
            <div id="player2-draws-value" class="player2-draws-value"></div>
          </div>
          <div class="player2-lost">
            <div id="player2-lost-label" class="player2-lost-label">LOST</div>
            <div id="player2-lost-value" class="player2-lost-value"></div>
          </div>
        </div>
      </section>

      <div class="box-game">
        <div class="controls-game">
          <button
            id="restart-btn"
            class="btn-restart"
            aria-label="restart game"
          >
            Restart
          </button>
          <button id="new-game-btn" class="btn-new-game" aria-label="new game">
            New Game
          </button>
        </div>
        <div
          id="box-game-info-text"
          class="game-info-text"
          aria-live="polite"
        ></div>
      </div>
    </main>
    <footer class="footer">
      <h3 class="footer-header">About me</h3>

      <ul class="footer-ul">
        <li class="footer-li">
          <a
            href="https://github.com/MightyCharm"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            ><i class="fab fa-github fa-2x" aria-hidden="true"></i
          ></a>
        </li>
        <li class="footer-li">
          <a
            href="https://www.freecodecamp.org/MightyCharm"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="freeCodeCamp"
            ><i class="fab fa-free-code-camp fa-2x" aria-hidden="true"></i
          ></a>
        </li>
        <li class="footer-li">
          <a
            href="https://www.linkedin.com/in/michael-m%C3%BCller-pforzheim"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Linkedin"
            ><i class="fab fa-linkedin fa-2x" aria-hidden="true"></i
          ></a>
        </li>
        <li class="footer-li">
          <a
            href="https://x.com/Michael_1800"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="X"
          >
            <i class="fa fa-twitter fa-2x"></i>
          </a>
        </li>
        <li class="footer-li">
          <a
            href="https://www.sololearn.com/de/profile/25075522"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Sololearn"
            ><img
              class="img-sololearn"
              src="./images/SoloLearn_logo.svg"
              alt="SoloLearn logo"
          /></a>
        </li>
      </ul>
      <p>coded by Micha</p>
    </footer>
    <script src="script.js"></script>
    <script
      src="https://kit.fontawesome.com/4bdff3182e.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
